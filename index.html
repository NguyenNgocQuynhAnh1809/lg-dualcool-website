<p class="note" style="margin-top:14px">* Chi phí đã bao gồm thuế phí.<br>* Giá trên không áp dụng kèm các ưu đãi khác của LG.</p>
<h3 class="sub" style="margin-top:32px">Bảo dưỡng máy lạnh</h3>
<div class="plans one"><div class="plan"><h3>Bảo dưỡng Máy lạnh</h3><div class="pr">Từ 350,000đ ~</div><p>Giúp máy lạnh hoạt động hiệu quả, ngăn ngừa những sự cố hỏng hóc không đáng có và kéo dài tuổi thọ sản phẩm bằng dịch vụ bảo dưỡng chuyên sâu của LG.</p><button type="button" class="btn demo-btn">Đăng ký</button><ul><li>Khử khuẩn dàn lạnh bằng tia UV</li><li>Vệ sinh lưới lọc dàn lạnh, dàn nóng</li><li>Kiểm tra hoạt động của máy sau khi bảo dưỡng</li><li>Khử khuẩn dàn lạnh, dàn nóng bằng hơi nước nóng</li></ul></div></div>

<h3 class="sub" style="margin-top:32px">Dịch vụ hỗ trợ thêm</h3>
<div class="cols c2"><div class="col"><h3>Hỗ trợ thêm</h3><ul class="tick"><li>Evening Care+: sửa ngoài giờ hành chính</li><li>Ontime Care: hẹn lịch sửa đúng giờ</li></ul></div></div>
<h3 class="sub" style="margin-top:32px">Những điều cần biết</h3>
<details open><summary>Nên mua gia hạn lúc nào?</summary><p>Tốt nhất là khi máy còn bảo hành chính hãng. Nếu mua sau khi hết bảo hành, gói có 30 ngày chờ và sự cố trong thời gian này không được bảo hành.</p></details>
<details><summary>Gói gia hạn bao gồm gì?</summary><p>Phạm vi giống bảo hành chính hãng, do LG và trung tâm bảo hành ủy quyền thực hiện. Số lần sửa không giới hạn, và LG cam kết hoàn tất sửa chữa trong 30 ngày làm việc kể từ lần kiểm tra đầu tiên.</p></details>
<details><summary>Có được hoàn tiền không?</summary><p>Có thể yêu cầu hoàn tiền trong 30 ngày kể từ ngày mua gói, nếu chưa có yêu cầu bảo hành nào.</p></details>
<p class="note">Không phải model hay thời điểm nào cũng có chương trình gia hạn giống nhau. Hãy xác nhận model, chi phí và thời hạn cụ thể trước khi đăng ký.</p>
<h2 id="s-dieukien" class="tsec">Điều kiện bảo hành</h2>
<div class="cols c2"><div class="col good"><h3>Được bảo hành khi</h3><ul class="tick"><li>Sản phẩm chính hãng LG, phân phối tại Việt Nam bởi LG hoặc nhà phân phối chính thức (kể cả quà tặng mang nhãn LG và hàng trưng bày).</li><li>Còn trong thời hạn bảo hành.</li><li>Tên model trên phiếu bảo hành, hóa đơn, hệ thống bảo hành điện tử trùng với model trên máy.</li><li>Lỗi do nhà sản xuất.</li><li>Nhãn, kiểu và số máy còn nguyên dạng.</li></ul></div><div class="col"><h3>Bị từ chối bảo hành khi</h3><ul class="tick"><li>Hư hỏng do thiên tai, hỏa hoạn, gỉ sét, ăn mòn hóa chất, côn trùng hoặc động vật xâm nhập.</li><li>Dùng sai điện áp, đặt nơi bụi bẩn, ẩm ướt hoặc bị nước vào.</li><li>Lỗi người dùng hoặc tác động bên ngoài như rơi, biến dạng, vỡ.</li><li>Lắp đặt, sử dụng, bảo trì sai hướng dẫn.</li><li>Đã bị sửa bởi đơn vị không được LG ủy quyền.</li><li>Hết hạn bảo hành, không phải hàng LG chính hãng hoặc là hàng khuyến mại.</li></ul></div></div>
<h2 id="s-thoihan" class="tsec">Thời hạn bảo hành máy lạnh LG</h2>
<h3 class="sub">Máy lạnh treo tường Inverter</h3>
<div style="overflow-x:auto"><table><thead><tr><th>Trường hợp</th><th>Thời hạn bảo hành</th></tr></thead><tbody><tr><td>Có ngày kích hoạt SW hoặc có hóa đơn mua hàng</td><td>24 tháng kể từ ngày mua, nhưng không quá 48 tháng kể từ ngày sản xuất</td></tr><tr><td>Chưa kích hoạt SW và không có hóa đơn</td><td>30 tháng kể từ ngày sản xuất</td></tr></tbody></table></div>
<h3 class="sub" style="margin-top:28px">Lưu ý</h3><ul class="tick"><li>Không có hóa đơn và chưa kích hoạt SW thì LG tính theo ngày sản xuất ghi trên máy hoặc hệ thống. Nếu chỉ biết tháng sản xuất, ngày sản xuất là ngày cuối tháng đó.</li><li>Ngày kích hoạt SW không đúng thực tế được coi như chưa kích hoạt và không có hóa đơn.</li><li>Ngày sản xuất của máy lạnh là ngày sản xuất của dàn lạnh. Dàn lạnh còn bảo hành thì cả máy còn bảo hành, kể cả khi dàn nóng đã hết hạn. Dàn lạnh hết hạn thì cả máy hết bảo hành.</li><li>Phạm vi bảo hành có thể khác theo điều khoản ghi trên phiếu bảo hành hoặc sách hướng dẫn.</li></ul>
<h3 class="sub" style="margin-top:28px">Bảo hành máy nén</h3>
<p style="margin:0 0 10px">Tính từ ngày mua nếu máy còn bảo hành tiêu chuẩn, tính từ ngày sản xuất nếu máy đã hết bảo hành lúc mua.</p>
<div class="cols c3"><div class="col good"><h3>10 năm</h3><p>Máy nén máy lạnh treo tường Inverter (từ 01/06/2015).</p></div><div class="col"><h3>5 năm</h3><p>Máy nén Inverter các model IFC09M1, IFC12M1, IFC18M1, IFC24M1 (từ 11/02/2026).</p></div><div class="col"><h3>3 năm</h3><p>Máy nén máy lạnh ON/OFF (từ 24/02/2023).</p></div></div>
<h2 id="s-lienhe" class="tsec">Cách liên hệ bảo hành LG</h2>
<div class="plan" style="margin-bottom:20px"><h3>Trung tâm Thông tin Khách hàng</h3><div class="pr">1800 1503</div><p style="margin-bottom:0">Miễn phí cước gọi. Bấm 1 cho tiếng Việt, 2 cho tiếng Anh, 3 cho tiếng Hàn.</p></div>
<div class="steps"><div class="col"><h3>1. Hỗ trợ từ xa</h3><p>Gọi tổng đài để được hướng dẫn xử lý sự cố từ xa.</p></div><div class="col"><h3>2. Bảo hành tại nhà</h3><p>Gọi tổng đài để hẹn lịch. Kỹ thuật viên LG được ủy quyền sẽ liên lạc và sửa tại địa chỉ của bạn.</p></div><div class="col"><h3>3. Tại trung tâm bảo hành</h3><p>Gọi tổng đài để được hướng dẫn, hoặc mang máy đến trung tâm cùng phiếu bảo hành hoặc chứng từ mua hàng. Xem danh sách ở trang <a href="/mua-hang" style="color:var(--red);font-weight:600">Mua hàng</a>.</p></div></div>
